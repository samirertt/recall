[project]
name = "engineering-memory"
version = "0.1.0"
description = "Local-first personal engineering incident knowledge system"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.19,<2.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "aiosqlite>=0.22,<0.23",
    "uvicorn[standard]>=0.52,<0.53",
    "python-multipart>=0.0.20",
    "charset-normalizer>=3.4",
    "rapidfuzz>=3.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "httpx>=0.28,<0.29",
    "ruff>=0.16,<0.17",
]
embeddings = [
    "fastembed>=0.5",
    "numpy>=2.1",
]
ingestion = [
    "pymupdf>=1.28",
    "pypdf>=6.17",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
]
ai = [
    "anthropic>=0.75",
    "openai>=2.0",
]
mcp = [
    "mcp>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
src = ["backend/app"]
extend-exclude = ["backend/alembic/versions"]  # autogenerated migrations, not hand-styled

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
